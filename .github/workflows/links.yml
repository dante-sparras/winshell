name: Links

# Links to other sites, on main and every Monday, since a site can move a page without a change here. Links between
# pages are the ci job's. This one runs apart from pull requests, so a site that is down for a moment can't fail one.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The lychee release archive, checked against its SHA-256 before it runs, so a replaced release asset can't
      # see the token. Dependabot doesn't update this: bump the version and the digest together.
      - name: Install lychee
        env:
          LYCHEE_VERSION: lychee-v0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          archive="$RUNNER_TEMP/lychee.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/lycheeverse/lychee/releases/download/$LYCHEE_VERSION/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "$LYCHEE_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      # A rate-limited link (429) is retried after a wait, and fails if it stays limited. about.signpath.io, the link
      # docs/code-signing-policy.md carries as SignPath Foundation asks, redirects with a header lychee can't parse.
      - name: Check links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          lychee
          --no-progress
          --max-retries 4
          --retry-wait-time 10
          --max-concurrency 4
          --exclude-path 'docs/agents'
          --exclude '^https://about\.signpath\.io/?$'
          'docs/**/*.md'
          README.md
          CONTRIBUTING.md
          GLOSSARY.md
          '.github/*.md'
