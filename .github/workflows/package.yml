name: Package

# Builds and verifies what a release ships with scripts/package.ps1: on PRs that change packaging or the release
# workflow, and on a push to main that is not only docs or Markdown, so a broken package shows before a release.
# release-please.yml calls it for a new draft release, and it can be run by hand to resume a draft; both publish only
# after its assets are verified. A docs-only push does not start this workflow. A release still does, through workflow_call.
# The upload also includes scripts/install.ps1 and scripts/uninstall.ps1, copied from the tagged commit.
on:
  pull_request:
    paths:
      - ".github/workflows/package.yml"
      - ".github/workflows/release-please.yml"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "scripts/package.ps1"
      - "scripts/publish-release.ps1"
      - "scripts/PublishRelease.Tests.ps1"
      - "packaging/**"
      - "src/Winshell/Winshell.csproj"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and upload to.
        type: string
        required: true
    secrets:
      WINGET_TOKEN:
        required: false
      SIGNPATH_API_TOKEN:
        required: false
  # Resumes an unpublished draft. Published releases with missing assets cannot be repaired in place.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing draft release tag to build and publish, such as v1.2.3.
        type: string
        required: true

permissions:
  contents: read

# One run per release tag, for the whole workflow. Two calls for the same tag queue, so they do not
# both build and both ask SignPath to sign. A push or a pull request has no tag, so it uses its own
# run id and does not wait behind another run. A queued run is not cancelled.
concurrency:
  group: package-${{ inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: release-gate
    # Always runs, and only the wait is conditional. A job that needs a skipped job is skipped too, even indirectly,
    # so a gate that ran only for a release would switch off package on every other run. It holds no Windows runner
    # while it waits, and its time doesn't come out of the budget package has for a signing approval.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.tag != '' }}
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Wait until ci succeeded on this commit
        # A release-please merge starts this workflow and ci together. Publishing before ci finishes would ship a
        # commit whose tests failed. Pull requests and main pushes skip this: inputs.tag is empty.
        if: ${{ inputs.tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          . ./scripts/ReleaseGate.ps1
          $sha = (git rev-parse HEAD).Trim()
          $deadline = (Get-Date).AddMinutes(40)
          do {
            $state = Get-WinshellReleaseCiState -CheckRuns (Get-WinshellCheckRuns -Repository $env:GH_REPO -Sha $sha)
            if ($state -eq 'green') { Write-Output "ci succeeded on $sha"; exit 0 }
            if ($state -eq 'red') { throw "ci did not succeed on $sha, so this release stops" }
            if ((Get-Date) -ge $deadline) { throw "ci did not finish on $sha within 40 minutes" }
            Start-Sleep -Seconds 30
          } while ($true)

  package:
    name: package
    needs: release-gate
    runs-on: windows-2025
    # A release waits for a person to approve its signing request in SignPath.
    timeout-minutes: ${{ inputs.tag != '' && 150 || 30 }}
    env:
      # A release is signed once the SignPath Foundation project is set up: see docs/code-signing-policy.md.
      SIGN: ${{ inputs.tag != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A release builds its tagged commit, not whatever commit started this run.
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Check the commit to sign
        # SignPath records the run's commit as the origin of what it signs, so the checkout must be that commit. This
        # runs before the build, so a repair started from main stops at once: start it from the release's tag.
        if: ${{ env.SIGN == 'true' }}
        shell: pwsh
        run: |
          $checkedOut = git rev-parse HEAD
          if ($checkedOut -ne $env:GITHUB_SHA) { throw "This run is for $env:GITHUB_SHA but checked out $checkedOut. Start it from the release's tag." }
      - name: Build
        shell: pwsh
        env:
          # Empty outside a release. For a release, the script stops unless the checkout is that version.
          TAG: ${{ inputs.tag }}
        run: pwsh scripts/package.ps1 -Publish -Out "$env:RUNNER_TEMP/artifacts" -Tag $env:TAG
      - name: Read the product version
        id: product
        if: ${{ env.SIGN == 'true' }}
        shell: pwsh
        run: |
          $version = (Get-Item "$env:RUNNER_TEMP/artifacts/publish/win-x64/winshell.dll").VersionInfo.ProductVersion
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Upload the binaries to sign
        id: unsigned
        if: ${{ env.SIGN == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: ${{ runner.temp }}/artifacts/publish/
          if-no-files-found: error
          # Re-run failed jobs after a rejected or timed-out request uploads again.
          overwrite: true
      - name: Sign with SignPath
        # SignPath signs only Winshell's own binaries, as its artifact configuration (packaging/signpath/) lists, after
        # an approver approves the request.
        if: ${{ env.SIGN == 'true' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'winshell' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          # Every signed binary must carry this product version, as packaging/signpath/artifact-configuration.xml says.
          parameters: |
            version: ${{ toJSON(steps.product.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 6600
          output-artifact-directory: ${{ runner.temp }}/signed
      - name: Use the signed binaries
        if: ${{ env.SIGN == 'true' }}
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "$env:RUNNER_TEMP/artifacts/publish" -Recurse -Force
          Move-Item -LiteralPath "$env:RUNNER_TEMP/signed" -Destination "$env:RUNNER_TEMP/artifacts/publish"
      - name: Pack and verify
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          # The Store identity Partner Center reserved. Unset, the package has a test identity.
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: >-
          ./scripts/package.ps1 -Pack -Verify -Out "$env:RUNNER_TEMP/artifacts" -Tag $env:TAG -Signed:($env:SIGN -eq 'true')
          -IdentityName $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME
      - name: Install the Store package on this runner
        # Windows accepts the manifest, and the winshell alias runs in the package. A throwaway certificate that only
        # this runner trusts signs a copy; the Store signs the real package.
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { 'CN=Winshell Test' }
          $msix = Get-ChildItem "$env:RUNNER_TEMP/artifacts/msix" -Filter '*-win-x64.msix' | Select-Object -First 1
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $publisher -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $cer = Join-Path $env:RUNNER_TEMP 'test-signing.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Directory -Filter '10.*' |
            Sort-Object { [version] $_.Name } -Descending | ForEach-Object { Join-Path $_.FullName 'x64/signtool.exe' } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          $signed = Join-Path $env:RUNNER_TEMP 'winshell-test.msix'
          Copy-Item $msix.FullName $signed
          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint $signed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-AppxPackage -Path $signed
          $package = Get-AppxPackage | Where-Object { $_.Publisher -eq $publisher -and $_.Name -like '*Winshell*' } | Select-Object -First 1
          if (-not $package) { throw 'The package did not install' }
          Write-Output "Installed $($package.PackageFullName)"
          $reported = & (Join-Path $env:LOCALAPPDATA 'Microsoft/WindowsApps/winshell.exe') --version
          Write-Output "The winshell alias reports: $reported"
          Remove-AppxPackage -Package $package.PackageFullName
          if ($reported -notmatch '^winshell \d+\.\d+\.\d+') { throw 'The winshell alias did not run' }
      - name: Stage the PowerShell installer
        shell: pwsh
        run: Copy-Item scripts/install.ps1, scripts/uninstall.ps1 "$env:RUNNER_TEMP/artifacts/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            ${{ runner.temp }}/artifacts/*.zip
            ${{ runner.temp }}/artifacts/*.ps1
            ${{ runner.temp }}/artifacts/SHA256SUMS.txt
            ${{ runner.temp }}/artifacts/winget/
          if-no-files-found: error
      # For Partner Center, which signs it. Not on the release: unsigned, it installs nowhere else.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-package
          path: ${{ runner.temp }}/artifacts/*.msixbundle
          # The release assets are the durable copy. This bundle is for Partner Center.
          retention-days: 14
          if-no-files-found: error

  release:
    name: release
    if: ${{ inputs.tag != '' }}
    needs: package
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write # uploads to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Upload, verify and publish the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          # Set once releases are signed, which is when the notes link the Code signing policy.
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: ./scripts/publish-release.ps1 -Tag $env:TAG -PackageDirectory packages -Repository $env:GH_REPO
      - name: Submit to winget
        shell: pwsh
        env:
          # wingetcreate reads this name. An argument would put the secret on the process command line.
          # A classic token with public_repo, from the account that forks microsoft/winget-pkgs. Without it, the
          # manifests stay on the release for a manual wingetcreate submit.
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          # scripts/package.ps1 validates the manifests with the WinGetUtil.dll this version is built with.
          WINGETCREATE_URL: https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe
          WINGETCREATE_SHA256: 24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Output 'No WINGET_TOKEN secret: the manifests are on the release, not submitted.'
            exit 0
          }
          $exe = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest $env:WINGETCREATE_URL -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:WINGETCREATE_SHA256) { throw 'wingetcreate.exe does not have the pinned hash' }
          $manifests = Get-ChildItem packages/winget -Directory | Select-Object -First 1
          & $exe submit --prtitle "New version: DanteSparras.Winshell $($manifests.Name)" $manifests.FullName
          exit $LASTEXITCODE

  # The package job checks arm64 headers on x64. This runs the executable.
  arm64:
    name: arm64
    needs: package
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Run the arm64 build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = @(Get-ChildItem -LiteralPath packages -Filter 'winshell-*-win-arm64.zip' -File)
          if ($zip.Count -ne 1) { throw "Expected one arm64 zip, found $($zip.Count)." }
          if ($zip[0].Name -notmatch '^winshell-(.+)-win-arm64\.zip$') { throw "Unexpected zip name $($zip[0].Name)." }
          $version = $Matches[1]
          $dest = Join-Path $env:RUNNER_TEMP 'arm64'
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $dest
          $exe = Join-Path $dest 'winshell.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'The arm64 zip has no winshell.exe.' }
          $reported = & $exe --version
          Write-Output $reported
          if ($LASTEXITCODE -ne 0 -or $reported -notmatch "^winshell $([regex]::Escape($version))(\+|$)") {
            throw "winshell.exe --version reported '$reported', not version $version."
          }
