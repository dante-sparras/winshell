name: Package

# Builds what a release ships with scripts/package.ps1: on PRs that change packaging, on every push to main so a
# broken package shows before a release, and from release-please.yml for a new release, which it then uploads.
on:
  pull_request:
    paths:
      - ".github/workflows/package.yml"
      - "scripts/package.ps1"
      - "src/Winshell/Winshell.csproj"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
  push:
    branches:
      - main
  workflow_call:
    inputs:
      tag:
        description: The release tag to upload the files to.
        type: string
        required: true
    secrets:
      WINGET_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build the packages
        shell: pwsh
        run: pwsh scripts/package.ps1 -Out "$env:RUNNER_TEMP/artifacts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            ${{ runner.temp }}/artifacts/*.zip
            ${{ runner.temp }}/artifacts/SHA256SUMS.txt
            ${{ runner.temp }}/artifacts/winget/
          if-no-files-found: error

  release:
    name: release
    if: ${{ inputs.tag != '' }}
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # uploads to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Upload to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          $files = @(Get-ChildItem packages -File | ForEach-Object FullName)
          gh release upload $env:TAG @files --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The winget manifests, zipped, so the release has one file per thing to download.
          Compress-Archive -Path packages/winget/* -DestinationPath "winget-manifests.zip"
          gh release upload $env:TAG winget-manifests.zip --clobber
          exit $LASTEXITCODE
      - name: Submit to winget
        shell: pwsh
        env:
          # A classic token with public_repo, from the account that forks microsoft/winget-pkgs. Without it, the
          # manifests stay on the release for a manual wingetcreate submit.
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGETCREATE_URL: https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe
          WINGETCREATE_SHA256: 24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Output 'No WINGET_TOKEN secret: the manifests are on the release, not submitted.'
            exit 0
          }
          $exe = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest $env:WINGETCREATE_URL -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:WINGETCREATE_SHA256) { throw 'wingetcreate.exe does not have the pinned hash' }
          $manifests = Get-ChildItem packages/winget -Directory | Select-Object -First 1
          & $exe submit --token $env:WINGET_TOKEN --prtitle "New version: DanteSparras.Winshell $($manifests.Name)" $manifests.FullName
          exit $LASTEXITCODE
