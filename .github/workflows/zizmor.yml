name: Workflows

# No path filter. A skipped job cannot be a required check, because GitHub waits for a check that never starts.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  zizmor:
    # Audits .github/ for unpinned actions, risky triggers, leaked credentials, and template injection.
    # A finding that is safe on purpose gets a `# zizmor: ignore[<audit>]` comment explaining why.
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
      security-events: write # publishes the SARIF to the Security tab
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # The action's default is latest, which follows a lock that moves when this action pin moves.
          # 1.31.1 is the newest stable release that lock can run.
          version: "1.31.1"
          # This repository is public, so code scanning accepts the SARIF. The action rejects annotations
          # at the same time.
          advanced-security: true
          annotations: false

  actionlint:
    # Catches broken expressions, typos, and shell errors in .github/workflows/.
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # The action's default is latest, which downloads whatever release rhysd/actionlint just published.
          version: "1.7.12"
