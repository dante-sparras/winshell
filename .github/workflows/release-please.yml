name: Release Please

on:
  push:
    branches:
      - main
  # Lets you re-run it, for example after adding the release token.
  workflow_dispatch:

permissions: {}

# Two quick merges queue up instead of racing to update the same release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write # tags and GitHub releases
      issues: write # labels on the release PR
      pull-requests: write # opens and updates the release PR
    steps:
      # PRs opened with GITHUB_TOKEN do not trigger CI, so required checks never run on the release
      # PR. RELEASE_PLEASE_TOKEN (a fine-grained PAT) fixes that; without it, close and reopen the
      # release PR to trigger its checks.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A new draft gets its files before Package publishes it, so immutable releases include every asset.
  # See docs/development.md#releasing.
  package:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write # uploads to the release
      checks: read # package.yml reads the ci result for this commit before it publishes
    # The pinned actionlint does not read the $/ self-repository form yet. The ./ form only loads files from this
    # commit here: nothing is checked out before a reusable workflow call.
    uses: ./.github/workflows/package.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
