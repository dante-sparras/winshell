name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # The ruleset requires this job by name. Rename it there too if you rename it here.
    name: ci
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Check
        shell: pwsh
        env:
          WINSHELL_NOTIFICATION_EVIDENCE: ${{ runner.temp }}/notification-evidence
        run: |
          New-Item -ItemType Directory -Force -Path $env:WINSHELL_NOTIFICATION_EVIDENCE | Out-Null
          foreach ($file in (git ls-tree -r --name-only HEAD^1 -- src/Winshell/DefaultShell)) {
            if (!$file.EndsWith('.qml')) { continue }
            $name = if ($file.EndsWith('/CalendarFlyout.qml')) { 'BeforeCalendar.qml' } else { Split-Path $file -Leaf }
            git show "HEAD^1:$file" | Set-Content (Join-Path $env:WINSHELL_NOTIFICATION_EVIDENCE $name)
          }
          pwsh scripts/check.ps1
      - name: Notification surface evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notification-surface
          path: ${{ runner.temp }}/notification-evidence/*.png
          if-no-files-found: ignore
