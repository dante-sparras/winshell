name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # The ruleset requires this job by name. Rename it there too if you rename it here.
    name: ci
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      flaky: ${{ steps.flaky.outputs.flaky }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Check
        shell: pwsh
        env:
          WINSHELL_FLAKY_REPORT: ${{ runner.temp }}/flaky-tests.txt
          WINSHELL_NOTIFICATION_EVIDENCE: ${{ runner.temp }}/notification-evidence
          WINSHELL_SETTINGS_EVIDENCE: ${{ runner.temp }}/settings-evidence
          WINSHELL_SNAPSHOT_DIFFS: ${{ runner.temp }}/snapshot-diffs
        run: |
          New-Item -ItemType Directory -Force -Path $env:WINSHELL_NOTIFICATION_EVIDENCE | Out-Null
          pwsh scripts/check.ps1
      - name: Stress new and changed tests
        # In this job because it is the required check. A failure here has to block the merge.
        if: github.event_name == 'pull_request'
        timeout-minutes: 20
        shell: pwsh
        run: pwsh scripts/stress-tests.ps1
      - name: Flaky tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-tests
          path: ${{ runner.temp }}/flaky-tests.txt
          if-no-files-found: ignore
      - name: Flag flaky tests
        id: flaky
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'flaky-tests.txt')) {
            'flaky=true' >> $env:GITHUB_OUTPUT
          }
      - name: Notification surface evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notification-surface
          path: ${{ runner.temp }}/notification-evidence/*.png
          if-no-files-found: ignore
      - name: Settings surface evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-surface
          path: ${{ runner.temp }}/settings-evidence/*.png
          if-no-files-found: ignore
      - name: Snapshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-diffs
          path: ${{ runner.temp }}/snapshot-diffs/*.png
          if-no-files-found: ignore

  flaky-report:
    # Files or updates an issue for each test that passed only on its rerun. It is a separate job so that ci, which
    # runs the code under test, gets no write token. A fork's token can't write, so a failure here blocks nothing.
    name: flaky-report
    needs: ci
    if: always() && needs.ci.outputs.flaky == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
      issues: write # files and comments on the flaky issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flaky-tests
          path: ${{ runner.temp }}/flaky-tests
      - name: Report
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pwsh scripts/report-flaky.ps1 -ReportPath (Join-Path $env:RUNNER_TEMP 'flaky-tests/flaky-tests.txt') -RunUrl $env:RUN_URL

  quarantine:
    # The tests in tests/quarantine.txt. A failed test shows in this job's log and blocks nothing. As in the media job,
    # continue-on-error is on the step.
    name: quarantine
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Quarantined tests
        continue-on-error: true
        shell: pwsh
        run: pwsh scripts/run-tests.ps1 -Quarantined

  media:
    # Runners often don't publish Windows media sessions. A failed test shows in this job's log and blocks nothing.
    # continue-on-error is on the step, so the failure doesn't put a red check on every pull request.
    name: media
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Media session test
        continue-on-error: true
        shell: pwsh
        run: dotnet test .\tests\Winshell.Platform.Windows.Tests --nologo --filter 'Category=Media'

  installer:
    name: installer
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'psmodules'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $policy = (Get-PSRepository PSGallery).InstallationPolicy
          if ($policy -ne 'Trusted') { Set-PSRepository PSGallery -InstallationPolicy Trusted }
          try {
            Save-Module Pester -RequiredVersion 5.6.1 -Path $dest -Repository PSGallery
            Save-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Path $dest -Repository PSGallery
          } finally {
            if ($policy -ne 'Trusted') { Set-PSRepository PSGallery -InstallationPolicy $policy }
          }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'psmodules');$env:PSModulePath"
          Import-Module PSScriptAnalyzer -RequiredVersion 1.22.0
          $settings = Join-Path $env:RUNNER_TEMP 'winshell-analyzer.psd1'
          @'
          @{
              Severity = @('Error', 'Warning')
              ExcludeRules = @(
                  # The user invoked the installer. Prompting would break irm | iex.
                  'PSUseShouldProcessForStateChangingFunctions'
              )
          }
          '@ | Set-Content -LiteralPath $settings -Encoding utf8
          $findings = @()
          foreach ($script in @('scripts/install.ps1', 'scripts/uninstall.ps1')) {
            $findings += @(Invoke-ScriptAnalyzer -Path $script -Settings $settings -Severity Warning, Error)
          }
          if ($findings.Count -gt 0) {
              $findings | Format-Table -AutoSize | Out-String | Write-Output
              exit 1
          }
      - name: Installer tests (PowerShell 7)
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'psmodules');$env:PSModulePath"
          Import-Module Pester -RequiredVersion 5.6.1
          Invoke-Pester -Path scripts/Install.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/Uninstall.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/PublishRelease.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/FlakyTests.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/StressTests.Tests.ps1 -CI
          exit $LASTEXITCODE
      - name: Installer tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'psmodules');$env:PSModulePath"
          Import-Module Pester -RequiredVersion 5.6.1
          Invoke-Pester -Path scripts/Install.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/Uninstall.Tests.ps1 -CI
          exit $LASTEXITCODE
