name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A pull request cancels its older run. Each push to main gets its own group, because a group holds only one pending run:
# a shared one would drop the ci run of a commit in a burst of merges, and a release commit would wait for a check that
# never comes.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # The ruleset requires this job by name. Rename it there too if you rename it here.
    name: ci
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      flaky: ${{ steps.flaky.outputs.flaky }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Turn Windows animation effects on
        # The runner has them off. Winshell follows that setting, and tests of a sliding taskbar or a fading on-screen
        # display need the frames in between, so this makes the runner match a default Windows desktop.
        shell: pwsh
        run: |
          Add-Type -Namespace Native -Name Spi -MemberDefinition '[DllImport("user32.dll", SetLastError = true)] public static extern bool SystemParametersInfoW(uint action, uint param, nint value, uint flags);'
          # SPI_SETCLIENTAREAANIMATION, on, SPIF_SENDCHANGE.
          if (-not [Native.Spi]::SystemParametersInfoW(0x1043, 0, 1, 2)) {
            throw "Could not turn animation effects on: error $([Runtime.InteropServices.Marshal]::GetLastWin32Error())"
          }
      - name: Check
        # A pull request waits for the build and the main tests. A push to main runs everything, and so does the release
        # pull request: once its commit is tagged, a failure can't be fixed in that version.
        timeout-minutes: 10
        shell: pwsh
        env:
          WINSHELL_FLAKY_REPORT: ${{ runner.temp }}/flaky-tests.txt
          WINSHELL_NOTIFICATION_EVIDENCE: ${{ runner.temp }}/notification-evidence
          WINSHELL_SETTINGS_EVIDENCE: ${{ runner.temp }}/settings-evidence
          WINSHELL_SNAPSHOT_DIFFS: ${{ runner.temp }}/snapshot-diffs
        run: |
          New-Item -ItemType Directory -Force -Path $env:WINSHELL_NOTIFICATION_EVIDENCE | Out-Null
          ./scripts/check.ps1 -Quick:($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $env:GITHUB_HEAD_REF -notlike 'release-please--*')
      - name: Flaky tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-tests
          path: ${{ runner.temp }}/flaky-tests.txt
          if-no-files-found: ignore
      - name: Flag flaky tests
        id: flaky
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'flaky-tests.txt')) {
            'flaky=true' >> $env:GITHUB_OUTPUT
          }
      - name: Notification surface evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notification-surface
          path: ${{ runner.temp }}/notification-evidence/*.png
          if-no-files-found: ignore
      - name: Settings surface evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-surface
          path: ${{ runner.temp }}/settings-evidence/*.png
          if-no-files-found: ignore
      - name: Snapshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-diffs
          path: ${{ runner.temp }}/snapshot-diffs/*.png
          if-no-files-found: ignore

  flaky-report:
    # Files or updates an issue for each test in the flaky report. It is a separate job so that ci, which
    # runs the code under test, gets no write token. A fork's token can't write, so a failure here blocks nothing.
    name: flaky-report
    needs: ci
    if: always() && needs.ci.outputs.flaky == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
      issues: write # files and comments on the flaky issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flaky-tests
          path: ${{ runner.temp }}/flaky-tests
      - name: Report
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pwsh scripts/report-flaky.ps1 -ReportPath (Join-Path $env:RUNNER_TEMP 'flaky-tests/flaky-tests.txt') -RunUrl $env:RUN_URL

  quarantine:
    # The tests in tests/quarantine.txt. A failed test shows in this job's log and blocks nothing. As in the media job,
    # continue-on-error is on the step, and the job skips pull requests, where a check that can't fail would only look
    # like a pass.
    name: quarantine
    if: github.event_name == 'push'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Quarantined tests
        continue-on-error: true
        shell: pwsh
        run: pwsh scripts/run-tests.ps1 -Quarantined

  media:
    # Runners often don't publish Windows media sessions. A failed test shows in this job's log and blocks nothing.
    # continue-on-error is on the step, so the failure doesn't put a red check on main. The job skips pull requests,
    # where a check that can't fail would only look like a pass.
    name: media
    if: github.event_name == 'push'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Media session test
        continue-on-error: true
        shell: pwsh
        run: dotnet test .\tests\Winshell.Platform.Windows.Tests --nologo --filter 'Category=Media'

  installer:
    name: installer
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The gallery nupkgs, checked against their SHA-256 before they are imported, so a replaced package can't run.
      # Dependabot doesn't update these: bump the version and the digest together.
      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        env:
          PESTER_VERSION: 5.6.1
          PESTER_SHA256: 37b3749f69accead67c366d81508977f62afc7cbb9c4db88c3a255a1f0b20da5
          PSSCRIPTANALYZER_VERSION: 1.22.0
          PSSCRIPTANALYZER_SHA256: 71bfb9eb58e19d4b662f4494a7d572a724b60e0588848dcff34195a0e08ae1be
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $dest = Join-Path $env:RUNNER_TEMP 'psmodules'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $modules = @(
            @{ Name = 'Pester'; Version = $env:PESTER_VERSION; Sha256 = $env:PESTER_SHA256 }
            @{ Name = 'PSScriptAnalyzer'; Version = $env:PSSCRIPTANALYZER_VERSION; Sha256 = $env:PSSCRIPTANALYZER_SHA256 }
          )
          foreach ($module in $modules) {
            $nupkg = Join-Path $env:RUNNER_TEMP "$($module.Name).$($module.Version).nupkg"
            Invoke-WebRequest -Uri "https://www.powershellgallery.com/api/v2/package/$($module.Name)/$($module.Version)" -OutFile $nupkg
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $nupkg).Hash
            if (-not $hash.Equals($module.Sha256, [StringComparison]::OrdinalIgnoreCase)) {
              throw "$($module.Name) $($module.Version) SHA-256 is $hash, expected $($module.Sha256)."
            }
            $root = Join-Path $dest (Join-Path $module.Name $module.Version)
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            $rootFull = [IO.Path]::GetFullPath($root)
            if (-not $rootFull.EndsWith('\')) { $rootFull += '\' }
            $zip = [IO.Compression.ZipFile]::OpenRead($nupkg)
            try {
              foreach ($entry in $zip.Entries) {
                if ([string]::IsNullOrEmpty($entry.Name)) { continue }
                $name = $entry.FullName.Replace('\', '/')
                if ($name -eq '[Content_Types].xml' -or $name.StartsWith('_rels/') -or $name.StartsWith('package/') -or $name.EndsWith('.nuspec')) { continue }
                if ($name.Contains('..')) { throw "The nupkg path escapes the module folder: $name" }
                $target = [IO.Path]::GetFullPath((Join-Path $root ($name.Replace('/', [IO.Path]::DirectorySeparatorChar))))
                if (-not $target.StartsWith($rootFull, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "The nupkg path escapes the module folder: $name"
                }
                $parent = Split-Path -Parent $target
                if (-not (Test-Path -LiteralPath $parent)) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
                [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $target, $true)
              }
            } finally {
              $zip.Dispose()
            }
          }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'psmodules');$env:PSModulePath"
          Import-Module PSScriptAnalyzer -RequiredVersion 1.22.0
          $settings = Join-Path $env:RUNNER_TEMP 'winshell-analyzer.psd1'
          @'
          @{
              Severity = @('Error', 'Warning')
              ExcludeRules = @(
                  # The user invoked the installer. Prompting would break irm | iex.
                  'PSUseShouldProcessForStateChangingFunctions'
              )
          }
          '@ | Set-Content -LiteralPath $settings -Encoding utf8
          $findings = @()
          foreach ($script in @('scripts/install.ps1', 'scripts/uninstall.ps1')) {
            $findings += @(Invoke-ScriptAnalyzer -Path $script -Settings $settings -Severity Warning, Error)
          }
          if ($findings.Count -gt 0) {
              $findings | Format-Table -AutoSize | Out-String | Write-Output
              exit 1
          }
      - name: Installer tests (PowerShell 7)
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'psmodules');$env:PSModulePath"
          Import-Module Pester -RequiredVersion 5.6.1
          Invoke-Pester -Path scripts/Install.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/Uninstall.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/PublishRelease.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/FlakyTests.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/ReleaseGate.Tests.ps1 -CI
          exit $LASTEXITCODE
      - name: Installer tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'psmodules');$env:PSModulePath"
          Import-Module Pester -RequiredVersion 5.6.1
          Invoke-Pester -Path scripts/Install.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/Uninstall.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/ReleaseGate.Tests.ps1 -CI
          exit $LASTEXITCODE
