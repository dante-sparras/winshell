name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

# Every check of a pull request is in this file, except pr-title and pr-rules, which need their own trigger. changes
# decides which of them a pull request needs, so a docs change holds one runner and not a dozen.
#
# A pull request cancels its older run. Each push to main gets its own group, because a group holds only one pending run:
# a shared one would drop the ci run of a commit in a burst of merges.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # What this pull request needs. The other jobs skip on false, and a skipped job counts as a passed required check.
    # Only false skips, so a changes job that failed, or a push to main where it does not run, still runs everything.
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      fast: ${{ steps.files.outputs.fast }}
      scripts: ${{ steps.files.outputs.scripts }}
      workflows: ${{ steps.files.outputs.workflows }}
    steps:
      - name: Look at the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # A draft leaves ci and slow to ready_for_review. A draft can't merge, so their skipped checks pass nothing.
          if [ "$DRAFT" = true ]; then
            echo 'fast=false' >> "$GITHUB_OUTPUT"
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi
          # A rename lists the path it left too: moving a file out of src/ can break what used it.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          # GitHub lists 3000 files at most, so a list that long may leave out what matters, and everything runs.
          if [ -z "$files" ] || [ "$(wc -l <<<"$files")" -ge 3000 ]; then exit 0; fi
          grep -qvE '^docs/|\.md$' <<<"$files" || echo 'code=false' >> "$GITHUB_OUTPUT"
          grep -qE '^scripts/|^tests/Scripts/|^\.github/(workflows|actions)/' <<<"$files" || echo 'scripts=false' >> "$GITHUB_OUTPUT"
          grep -qE '^\.github/(workflows|actions)/' <<<"$files" || echo 'workflows=false' >> "$GITHUB_OUTPUT"

  ci:
    # The ruleset requires this job by name. Rename it there too if you rename it here.
    name: ci
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.fast != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      built: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Offline, so only links to files in the repo and their headings: links.yml checks other sites. The lychee release
      # archive is checked against its SHA-256 before it runs. Dependabot doesn't update this: bump the version and the
      # digest together, here and in links.yml.
      - name: Check links between pages
        shell: pwsh
        env:
          LYCHEE_VERSION: lychee-v0.24.2
          LYCHEE_SHA256: 32975d1493ee1a975d6bb41e4fb56fe419cb442ded628bb772ba2e614acfacad
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'lychee.zip'
          Invoke-WebRequest -Uri "https://github.com/lycheeverse/lychee/releases/download/$env:LYCHEE_VERSION/lychee-x86_64-pc-windows-msvc.zip" -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if (-not $hash.Equals($env:LYCHEE_SHA256, [StringComparison]::OrdinalIgnoreCase)) {
            throw "lychee $env:LYCHEE_VERSION SHA-256 is $hash, expected $env:LYCHEE_SHA256."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          & (Join-Path $env:RUNNER_TEMP 'lychee-x86_64-pc-windows-msvc\lychee.exe') --offline --include-fragments --no-progress '**/*.md' '.github/**/*.md'
          exit $LASTEXITCODE
      # The pinned actionlint cannot parse self-repository syntax; local actions use this checkout.
      - uses: ./.github/actions/prepare # zizmor: ignore[self-repository]
      - uses: ./.github/actions/powershell # zizmor: ignore[self-repository]
      - name: Build
        id: build
        shell: pwsh
        run: dotnet build .\winshell.slnx -warnaserror --nologo
      - name: Check
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'psmodules');$env:PSModulePath"
          ./scripts/check.ps1 -NoBuild
  stop:
    # Code that doesn't compile has nothing for slow to prove, so its runner goes back. It is a separate job so that ci,
    # which runs the code under test, gets no token that can cancel a run.
    name: stop
    needs: ci
    if: ${{ failure() && github.event_name == 'pull_request' && needs.ci.outputs.built == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # cancels this run
    steps:
      - name: Cancel the rest of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: gh run cancel "$RUN"

  slow:
    # The tests that start winshell.exe or open a real window. The ruleset requires this job by name.
    name: slow
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned actionlint cannot parse self-repository syntax; local actions use this checkout.
      - uses: ./.github/actions/prepare # zizmor: ignore[self-repository]
      - name: Build
        shell: pwsh
        run: dotnet build .\winshell.slnx -warnaserror --nologo
      - name: Slow tests
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/check.ps1 -NoBuild -Tier Slow

  actionlint:
    # actionlint catches broken expressions, typos and shell errors in .github/workflows/. zizmor audits .github/ for
    # unpinned actions, risky triggers, leaked credentials and template injection. A finding that is safe on purpose gets
    # a `# zizmor: ignore[<audit>]` comment explaining why. The ruleset requires this job by name.
    name: actionlint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.workflows != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
      security-events: write # publishes the SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # The action's default is latest, which downloads whatever release rhysd/actionlint just published.
          version: "1.7.12"
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # The action's default is latest, which follows a lock that moves when this action pin moves.
          # 1.31.1 is the newest stable release that lock can run.
          version: "1.31.1"
          # This repository is public, so code scanning accepts the SARIF. The action rejects annotations
          # at the same time.
          advanced-security: true
          annotations: false

  trim-caches:
    # CodeQL's default setup saves a database per language on each push to main and reads only the newest, which fills
    # the 10 GB GitHub keeps. It is a separate job so that the job that runs the code under test gets no token that can
    # delete caches.
    name: trim-caches
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # deletes cache entries
    steps:
      - name: Delete all but the newest databases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Two per language and CodeQL version, which the key names before the commit: this push's may still be saving
        # while the last push's is the one read. Two pushes can race to delete the same entry, and nothing needs this
        # step to pass.
        continue-on-error: true
        run: |
          gh api --paginate "repos/$GH_REPO/actions/caches?key=codeql-overlay-base-database-&sort=created_at&direction=desc&per_page=100" \
            --jq '.actions_caches[] | "\(.id) \(.key)"' | sed -E 's/-[0-9a-f]{40}-.*//' | awk 'seen[$2]++ >= 2 { print $1 }' |
            xargs -r -I{} gh api --method DELETE "repos/$GH_REPO/actions/caches/{}"

  installer:
    name: installer
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scripts != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned actionlint cannot parse self-repository syntax; local actions use this checkout.
      - uses: ./.github/actions/powershell # zizmor: ignore[self-repository]
      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'psmodules');$env:PSModulePath"
          Import-Module Pester -RequiredVersion 5.6.1
          Invoke-Pester -Path tests/Scripts/Install.Tests.ps1 -CI
          exit $LASTEXITCODE
