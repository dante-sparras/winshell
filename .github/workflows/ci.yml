name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Every check of a pull request is in this file, except pr-title, which needs its own trigger. changes decides which of
# them a pull request needs, so a docs change holds one runner and not a dozen.
#
# A pull request cancels its older run. Each push to main gets its own group, because a group holds only one pending run:
# a shared one would drop the ci run of a commit in a burst of merges, and a release commit would wait for a check that
# never comes.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # What this pull request needs. The other jobs skip on false, and a skipped job counts as a passed required check.
    # Only false skips, so a changes job that failed, or a push to main where it does not run, still runs everything.
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      docs: ${{ steps.files.outputs.docs }}
      scripts: ${{ steps.files.outputs.scripts }}
      workflows: ${{ steps.files.outputs.workflows }}
    steps:
      - name: Look at the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          [ -n "$files" ] || exit 0
          grep -qvE '^docs/|\.md$' <<<"$files" || echo 'code=false' >> "$GITHUB_OUTPUT"
          grep -qE '^docs/|\.md$|^dotnet-tools\.json$|^global\.json$|^\.github/workflows/ci\.yml$' <<<"$files" || echo 'docs=false' >> "$GITHUB_OUTPUT"
          grep -qE '^scripts/|^\.github/(workflows|actions)/' <<<"$files" || echo 'scripts=false' >> "$GITHUB_OUTPUT"
          grep -qE '^\.github/(workflows|actions)/' <<<"$files" || echo 'workflows=false' >> "$GITHUB_OUTPUT"

  ci:
    # The ruleset requires this job by name. Rename it there too if you rename it here.
    name: ci
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      built: ${{ steps.build.outcome }}
      flaky: ${{ steps.flaky.outputs.flaky }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: Build
        id: build
        shell: pwsh
        run: dotnet build .\winshell.slnx -warnaserror --nologo
      - name: Check
        # A pull request waits for the build and the main tests. A push to main runs everything, and so does the release
        # pull request: once its commit is tagged, a failure can't be fixed in that version.
        timeout-minutes: 10
        shell: pwsh
        env:
          WINSHELL_FLAKY_REPORT: ${{ runner.temp }}/flaky-tests.txt
        run: ./scripts/check.ps1 -NoBuild -Tier Fast -Quick:($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $env:GITHUB_HEAD_REF -notlike 'release-please--*')
      # Only main writes the caches, so a pull request can't change what another one starts from.
      - name: Note which files this build saw
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .build-cache | Out-Null
          git -c core.quotePath=false ls-files --stage | Set-Content -LiteralPath .build-cache/tracked.txt
      - name: Save this build
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/*/bin
            src/*/obj
            tests/*/bin
            tests/*/obj
            templates/bin
            templates/obj
            .build-cache
          key: build-${{ github.sha }}
      - name: Save NuGet packages
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
      - name: Flaky tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-tests
          path: ${{ runner.temp }}/flaky-tests.txt
          if-no-files-found: ignore
      - name: Flag flaky tests
        id: flaky
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'flaky-tests.txt')) {
            'flaky=true' >> $env:GITHUB_OUTPUT
          }
  stop:
    # Code that doesn't compile has nothing for slow to prove, so its runner goes back. It is a separate job so that ci,
    # which runs the code under test, gets no token that can cancel a run.
    name: stop
    needs: ci
    if: ${{ failure() && github.event_name == 'pull_request' && needs.ci.outputs.built == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # cancels this run
    steps:
      - name: Cancel the rest of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: gh run cancel "$RUN"

  slow:
    # The tests that start winshell.exe or open a real window. The ruleset requires this job by name.
    name: slow
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      flaky: ${{ steps.flaky.outputs.flaky }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: Build
        shell: pwsh
        run: dotnet build .\winshell.slnx -warnaserror --nologo
      - name: Slow tests
        timeout-minutes: 10
        shell: pwsh
        env:
          WINSHELL_FLAKY_REPORT: ${{ runner.temp }}/flaky-tests.txt
        run: ./scripts/run-tests.ps1 -Tier Slow
      - name: Flaky tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-tests-slow
          path: ${{ runner.temp }}/flaky-tests.txt
          if-no-files-found: ignore
      - name: Flag flaky tests
        id: flaky
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'flaky-tests.txt')) {
            'flaky=true' >> $env:GITHUB_OUTPUT
          }

  build:
    # Builds docs/ into a site with DocFX. A broken link or anchor between pages fails the build.
    name: build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build the site
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx.json --warningsAsErrors

  actionlint:
    # actionlint catches broken expressions, typos and shell errors in .github/workflows/. zizmor audits .github/ for
    # unpinned actions, risky triggers, leaked credentials and template injection. A finding that is safe on purpose gets
    # a `# zizmor: ignore[<audit>]` comment explaining why. The ruleset requires this job by name.
    name: actionlint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.workflows != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
      security-events: write # publishes the SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # The action's default is latest, which downloads whatever release rhysd/actionlint just published.
          version: "1.7.12"
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # The action's default is latest, which follows a lock that moves when this action pin moves.
          # 1.31.1 is the newest stable release that lock can run.
          version: "1.31.1"
          # This repository is public, so code scanning accepts the SARIF. The action rejects annotations
          # at the same time.
          advanced-security: true
          annotations: false

  flaky-report:
    # Files or updates an issue for each test in the flaky reports. It is a separate job so that the jobs that run the
    # code under test get no write token. A fork's token can't write, so a failure here blocks nothing.
    name: flaky-report
    needs: [ci, slow]
    if: always() && (needs.ci.outputs.flaky == 'true' || needs.slow.outputs.flaky == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
      issues: write # files and comments on the flaky issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flaky-tests*
          path: ${{ runner.temp }}/flaky-tests
      - name: Report
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          foreach ($report in Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'flaky-tests') -Filter flaky-tests.txt -Recurse) {
            pwsh scripts/report-flaky.ps1 -ReportPath $report.FullName -RunUrl $env:RUN_URL
          }

  quarantine:
    # The tests in tests/quarantine.txt. A failed test shows in this job's log and blocks nothing.
    # continue-on-error is on the step, and the job skips pull requests, where a check that can't fail would only look
    # like a pass.
    name: quarantine
    if: github.event_name == 'push'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Quarantined tests
        continue-on-error: true
        shell: pwsh
        run: pwsh scripts/run-tests.ps1 -Quarantined

  installer:
    name: installer
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scripts != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The gallery nupkgs, checked against their SHA-256 before they are imported, so a replaced package can't run.
      # Dependabot doesn't update these: bump the version and the digest together.
      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        env:
          PESTER_VERSION: 5.6.1
          PESTER_SHA256: 37b3749f69accead67c366d81508977f62afc7cbb9c4db88c3a255a1f0b20da5
          PSSCRIPTANALYZER_VERSION: 1.22.0
          PSSCRIPTANALYZER_SHA256: 71bfb9eb58e19d4b662f4494a7d572a724b60e0588848dcff34195a0e08ae1be
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $dest = Join-Path $env:RUNNER_TEMP 'psmodules'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $modules = @(
            @{ Name = 'Pester'; Version = $env:PESTER_VERSION; Sha256 = $env:PESTER_SHA256 }
            @{ Name = 'PSScriptAnalyzer'; Version = $env:PSSCRIPTANALYZER_VERSION; Sha256 = $env:PSSCRIPTANALYZER_SHA256 }
          )
          foreach ($module in $modules) {
            $nupkg = Join-Path $env:RUNNER_TEMP "$($module.Name).$($module.Version).nupkg"
            Invoke-WebRequest -Uri "https://www.powershellgallery.com/api/v2/package/$($module.Name)/$($module.Version)" -OutFile $nupkg
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $nupkg).Hash
            if (-not $hash.Equals($module.Sha256, [StringComparison]::OrdinalIgnoreCase)) {
              throw "$($module.Name) $($module.Version) SHA-256 is $hash, expected $($module.Sha256)."
            }
            $root = Join-Path $dest (Join-Path $module.Name $module.Version)
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            $rootFull = [IO.Path]::GetFullPath($root)
            if (-not $rootFull.EndsWith('\')) { $rootFull += '\' }
            $zip = [IO.Compression.ZipFile]::OpenRead($nupkg)
            try {
              foreach ($entry in $zip.Entries) {
                if ([string]::IsNullOrEmpty($entry.Name)) { continue }
                $name = $entry.FullName.Replace('\', '/')
                if ($name -eq '[Content_Types].xml' -or $name.StartsWith('_rels/') -or $name.StartsWith('package/') -or $name.EndsWith('.nuspec')) { continue }
                if ($name.Contains('..')) { throw "The nupkg path escapes the module folder: $name" }
                $target = [IO.Path]::GetFullPath((Join-Path $root ($name.Replace('/', [IO.Path]::DirectorySeparatorChar))))
                if (-not $target.StartsWith($rootFull, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "The nupkg path escapes the module folder: $name"
                }
                $parent = Split-Path -Parent $target
                if (-not (Test-Path -LiteralPath $parent)) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
                [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $target, $true)
              }
            } finally {
              $zip.Dispose()
            }
          }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'psmodules');$env:PSModulePath"
          Import-Module PSScriptAnalyzer -RequiredVersion 1.22.0
          $settings = Join-Path $env:RUNNER_TEMP 'winshell-analyzer.psd1'
          @'
          @{
              Severity = @('Error', 'Warning')
              ExcludeRules = @(
                  # The user invoked the installer. Prompting would break irm | iex.
                  'PSUseShouldProcessForStateChangingFunctions'
              )
          }
          '@ | Set-Content -LiteralPath $settings -Encoding utf8
          $findings = @()
          foreach ($script in @('scripts/install.ps1', 'scripts/uninstall.ps1')) {
            $findings += @(Invoke-ScriptAnalyzer -Path $script -Settings $settings -Severity Warning, Error)
          }
          if ($findings.Count -gt 0) {
              $findings | Format-Table -AutoSize | Out-String | Write-Output
              exit 1
          }
      - name: Installer tests (PowerShell 7)
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'psmodules');$env:PSModulePath"
          Import-Module Pester -RequiredVersion 5.6.1
          Invoke-Pester -Path scripts/Install.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/Uninstall.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/PublishRelease.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/FlakyTests.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/ReleaseGate.Tests.ps1 -CI
          exit $LASTEXITCODE
      - name: Installer tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'psmodules');$env:PSModulePath"
          Import-Module Pester -RequiredVersion 5.6.1
          Invoke-Pester -Path scripts/Install.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/Uninstall.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-Pester -Path scripts/ReleaseGate.Tests.ps1 -CI
          exit $LASTEXITCODE
