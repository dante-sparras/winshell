# Called from ci.yml. Not a pull-request entry point.
# The score gate is thresholds.break in stryker-config.json.
# There is no C# yet. The job restores the tool and exits when tests/ has no project.

name: Mutation testing

on:
  workflow_call:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore Stryker
        run: dotnet tool restore

      - name: Run Stryker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = Join-Path $env:GITHUB_WORKSPACE 'tests'
          $config = Join-Path $env:GITHUB_WORKSPACE 'stryker-config.json'
          if (-not (Test-Path $config)) { throw "Missing $config" }
          if (-not (Test-Path $tests)) {
            Write-Output 'No tests directory. Stryker runs when a project exists under tests/.'
            exit 0
          }
          $projects = @(Get-ChildItem -Path $tests -Filter *.csproj -Recurse -File)
          if ($projects.Count -eq 0) {
            Write-Output 'No test project under tests/. Stryker runs when one is added.'
            exit 0
          }
          foreach ($project in $projects) {
            $relative = [System.IO.Path]::GetRelativePath($project.DirectoryName, $config)
            Write-Output "Mutation testing $($project.FullName)"
            Push-Location $project.DirectoryName
            try {
              dotnet stryker --config-file $relative
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            finally {
              Pop-Location
            }
          }

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: '**/StrykerOutput/**/mutation-report.html'
          if-no-files-found: ignore
          retention-days: 14
