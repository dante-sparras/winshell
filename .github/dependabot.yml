version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised one is usually caught first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    # Group minor and patch updates; each major update gets its own PR, so one breaking change can't
    # hold back the rest.
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
